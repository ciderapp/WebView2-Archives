name: Archive WebView2

on:
  schedule:
    # Every 6 hours. Scheduled workflows only run once this file is on the default branch.
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: archive-webview2
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install aria2
        run: sudo apt-get update && sudo apt-get install -y aria2

      - name: Archive new versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: go run ./cmd/archive

      - name: Commit catalog index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json latest.json
          if git diff --cached --quiet; then
            echo "Catalog unchanged"
          else
            git commit -m "Update archive catalog"
            git push
          fi
